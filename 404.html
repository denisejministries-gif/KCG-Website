<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting… | Kingdom Culture Global Ministries</title>
<script>
  // Single-page-app redirect trick for GitHub Pages (no server-side routing).
  // GitHub serves this file for any unknown path (e.g. /about). It encodes
  // the intended path into a query string and redirects to the site root,
  // where a small script in index.html decodes it and restores the real
  // URL via history.replaceState before the app renders that page.
  var pathSegmentsToKeep = 0; // 0 because this site is served from the domain root
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
